
name: Build ZiNRAi Scanner APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Install Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -q ZinraiScannerAndroid.zip -d android-project

      - name: Build APK
        run: |
          PROJECT_DIR=$(find android-project -type f -name settings.gradle.kts -print -quit | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "No se encontró settings.gradle.kts"
            exit 1
          fi
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZiNRAi-Scanner-APK
          path: android-project/**/build/outputs/apk/debug/*.apk
